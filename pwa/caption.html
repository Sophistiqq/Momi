<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Moments</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#09090b" />
<style>html { background: #09090b; }</style>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="cap-page">
  <main class="cap-card">
    <h1 class="logo">Moments</h1>
    <p class="msg" id="msg">Uploading…</p>
    <textarea id="cap" class="input" rows="3" placeholder="Write a caption…"></textarea>
    <div class="cap-actions">
      <button id="save" class="btn btn-primary" disabled>Save caption</button>
      <a class="btn btn-ghost" href="/">Done</a>
    </div>
  </main>

<script>
  // The service worker already uploaded the share and redirected here with
  // the new post id, so this page only collects an optional caption.
  const q = new URLSearchParams(location.search);
  const id = q.get('id');
  const msg = document.getElementById('msg');
  const cap = document.getElementById('cap');
  const save = document.getElementById('save');

  if (!id) {
    msg.textContent = 'Nothing came through — try sharing again.';
  } else {
    cap.value = q.get('text') ?? '';
    msg.textContent = 'Uploaded — add a caption?';
    save.disabled = false;
  }

  save.onclick = async () => {
    await fetch('/share-target/posts/' + id + '/caption', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caption: cap.value }),
    });
    msg.textContent = 'Caption saved.';
    cap.disabled = true;
    save.disabled = true;
  };
</script>
</body>
</html>
