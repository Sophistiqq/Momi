<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Moments</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#09090b" />
<style>html { background: #09090b; }</style>
<link rel="stylesheet" href="/style.css" />
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body x-data="feed" x-init="init()">

<header class="topbar" x-show="user">
  <h1 class="logo logo-lg">Moments</h1>
  <div class="topbar-right">
    <span class="count" x-text="countText"></span>
    <button class="btn btn-ghost" @click="signOut()" aria-label="Sign out">Sign out</button>
    <button class="icon-btn" @click="init()" :disabled="loading" aria-label="Refresh">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" :class="{ 'spin': loading }">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 1.5v3h-3"/>
      </svg>
    </button>
  </div>
</header>
<!-- Sign-in card: Google OAuth, PKCE redirect back to the app -->
<div class="state login" :class="{ 'show': !user }">
  <h1 class="logo">Moments</h1>
  <p>Sign in to see your moments.</p>
  <button class="btn btn-google" @click="googleSignIn()" :disabled="signingIn">
    <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
      <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.2 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/>
    </svg>
    <span x-text="signingIn ? 'Redirecting…' : 'Sign in with Google'"></span>
  </button>
  <p class="auth-error" x-show="authError" x-text="authError"></p>
</div>

<main x-show="user">
  <div class="state" :class="{ 'show': loading }">
    <h2>Loading…</h2>
  </div>

  <div class="state" :class="{ 'show': !loading && error }">
    <h2>Couldn&rsquo;t load</h2>
    <p>Check your connection and try again.</p>
    <button class="btn btn-primary" @click="init()">Try again</button>
  </div>

  <div class="state" :class="{ 'show': !loading && !error && posts.length === 0 }">
    <h2>Nothing here yet</h2>
    <p>Share a photo or video from your gallery — it&rsquo;ll land right here.</p>
  </div>

  <!-- Feed: 3-up square grid, Instagram-style -->
  <div class="feed" x-show="!loading && !error && posts.length">
    <template x-for="post in posts" :key="post.id">
      <button class="tile" @click="openPost(post)">
        <template x-if="isVideo(post)">
          <video :src="feedSrc(post)" preload="metadata" muted playsinline></video>
        </template>
        <template x-if="!isVideo(post) && postMedia(post)">
          <img :src="postMedia(post).url" :alt="post.caption || ''" loading="lazy" />
        </template>
        <svg class="play" x-show="isVideo(post)" viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
          <circle cx="12" cy="12" r="10.5" fill="rgba(0,0,0,.45)"/>
          <path d="M10 8.5l6 3.5-6 3.5z"/>
        </svg>
        <svg class="multi" x-show="(post.post_media?.length || 0) > 1" viewBox="0 0 16 16"
             width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1.6" y="4.6" width="10" height="10" rx="1.8"/><path d="M4.5 1.5h7.9a2.1 2.1 0 0 1 2.1 2.1v7.9"/>
        </svg>
      </button>
    </template>
  </div>
</main>

<!-- Post viewer: full screen on mobile, side-by-side on desktop -->
<div class="viewer" x-show="user" :class="{ 'open': activePost }" @keydown.escape.window="activePost = null">
  <div class="viewer-backdrop" @click="activePost = null"></div>
  <template x-if="activePost">
    <div class="viewer-panel">
      <!-- Square stage by default (Instagram-style); tap for the full uncropped image -->
      <div class="media-cell" :class="{ 'fit': fitMode }"
           @click="onMediaTap()"
           @touchstart.passive="onTouchStart($event)"
           @touchmove.prevent="onTouchMove($event)"
           @touchend.passive="onTouchEnd($event)">
        <div class="strip" :style="'transform: translateX(-' + (mediaIndex * 100) + '%)'">
          <template x-for="(m, i) in activePost.post_media" :key="m.id">
            <div class="slide">
              <template x-if="(m.mime_type || '').startsWith('video')">
                <video :src="m.url" :controls="i === mediaIndex" preload="metadata" @click.stop></video>
              </template>
              <template x-if="!((m.mime_type || '').startsWith('video'))">
                <img :src="m.url" :alt="activePost.caption || ''" />
              </template>
            </div>
          </template>
        </div>
        <div class="dots" x-show="(activePost.post_media?.length || 0) > 1">
          <template x-for="(m, i) in activePost.post_media" :key="i">
            <button :class="{ 'active': i === mediaIndex }" @click.stop="mediaIndex = i"></button>
          </template>
        </div>
      </div>

      <div class="info-cell">
        <div class="info-head">
          <span class="date" x-text="formatDate(activePost.created_at)"></span>
          <button class="icon-btn" @click="startEditCaption()" aria-label="Edit caption">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M11.3 2.2a1.5 1.5 0 0 1 2.1 2.1L5 12.7l-3 .7.7-3z"/>
            </svg>
          </button>
          <button class="icon-btn" @click="activePost = null" aria-label="Close">✕</button>
        </div>

        <div class="info-scroll">
          <template x-if="!editingCaption">
            <div class="comment caption-comment">
              <p class="author" x-show="activePost.author" x-text="activePost.author"></p>
              <p :class="{ 'muted': !activePost.caption }" x-text="activePost.caption || 'No caption yet'"></p>
              <span class="meta" x-text="formatDate(activePost.created_at)"></span>
            </div>
          </template>
          <template x-if="editingCaption">
            <div>
              <textarea class="input" x-model="captionDraft" rows="3"
                        placeholder="Write a caption…" @keydown.ctrl.enter="saveCaption()"></textarea>
              <div class="caption-edit-actions">
                <button class="btn btn-ghost" @click="editingCaption = false">Cancel</button>
                <button class="btn btn-primary" @click="saveCaption()">Save</button>
              </div>
            </div>
          </template>

          <p class="comments-title">Comments</p>
          <p class="comments-empty" x-show="!comments.length">Be the first to comment.</p>
          <template x-for="c in comments" :key="c.id">
            <div class="comment">
              <p><span class="author" x-text="c.author || 'Anonymous'"></span><span x-text="c.body"></span></p>
              <span class="meta" x-text="formatDate(c.created_at)"></span>
            </div>
          </template>
        </div>

        <div class="composer">
          <input class="input" x-model="newComment" placeholder="Add a comment…"
                 @keydown.enter="addComment()" :disabled="commenting" />
          <button class="icon-btn" @click="addComment()" aria-label="Post"
                  :disabled="commenting || !newComment.trim()">
            <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 8L14.5 1.5 9.5 14.5l-1.6-5-6.4-1.5z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<!-- New-version banner: shown when the service worker has an update ready -->
<div class="update-banner" id="updateBanner" hidden>
  <span>New version available</span>
  <button class="btn btn-primary" id="updateBtn">Update</button>
</div>

<script>
  // Session lives in a cookie (not localStorage) because the Android share
  // sheet and the caption page's XHR are plain navigations/fetches that can't
  // attach an Authorization header — cookies ride along. The edge function
  // reads the same cookie and rejects requests without a valid session.
  const cookieStorage = {
    getItem(key) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    },
    setItem(key, value) {
      // Slim sessions to tokens only: the full session (with Google user
      // metadata) exceeds Chrome's ~4KB cookie limit and gets silently
      // dropped. PKCE code verifiers must pass through untouched — they have
      // no access_token, and stripping them breaks the OAuth exchange.
      try {
        const s = JSON.parse(value);
        if (s?.access_token) {
          value = JSON.stringify({
            access_token: s.access_token,
            refresh_token: s.refresh_token,
            expires_at: s.expires_at,
            token_type: s.token_type,
          });
        }
      } catch {}
      document.cookie = key + '=' + encodeURIComponent(value) + '; path=/; max-age=31536000; SameSite=Lax; Secure';
    },
    removeItem(key) {
      document.cookie = key + '=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
    },
  };

  const authClient = supabase.createClient(
    'https://wmouyojmcelxgkwjfpxz.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indtb3V5b2ptY2VseGdrd2pmcHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjA5MTEsImV4cCI6MjEwMTAzNjkxMX0.PRuJlyXfuCTmtUXf3MLwNdRs8JcFJpZ0Y4DDL3Hz_m8',
    {
      auth: {
        storageKey: 'sb-auth-token',
        storage: cookieStorage,
        persistSession: true,
        flowType: 'pkce',
      },
    },
  );

  function feed() {
    return {
      posts: [],
      loading: true,
      error: false,
      activePost: null,
      mediaIndex: 0,
      fitMode: false,
      touchX: 0,
      zoom: 1,
      tapAt: 0,
      pinch: { active: false, dist: 0, scale: 1 },
      comments: [],
      newComment: '',
      commenting: false,
      editingCaption: false,
      captionDraft: '',
      user: null,
      signingIn: false,
      authError: '',

      get media() {
        return (this.activePost?.post_media || [])[this.mediaIndex] || null;
      },

      get countText() {
        return this.posts.length ? `${this.posts.length} moment${this.posts.length > 1 ? 's' : ''}` : '';
      },

      postMedia(post) {
        return post?.post_media?.[0] || null;
      },

      isVideo(post) {
        const m = this.postMedia(post);
        return !!m && (m.mime_type || '').startsWith('video');
      },

      feedSrc(post) {
        const m = this.postMedia(post);
        if (!m) return '';
        // #t=0.1 forces Chrome to grab a real frame instead of a black box.
        return (m.mime_type || '').startsWith('video') ? m.url + '#t=0.1' : m.url;
      },

      async init() {
        const { data } = await authClient.auth.getSession();
        // The cookie holds tokens only (user object was slimmed to fit the
        // cookie size limit) and we never display user details, so presence
        // is enough — no getUser() round trip, no login-screen flash.
        this.user = data.session ? (data.session.user ?? true) : null;
        if (this.user) await this.load();
        // Google's redirect lands back on this page with a PKCE code; the
        // exchange happens after init, so this picks up the resulting session.
        authClient.auth.onAuthStateChange((_event, session) => {
          if (session?.user && !this.user) {
            this.user = session.user;
            this.load();
          }
        });
      },

      async load() {
        this.loading = true;
        this.error = false;
        try {
          const res = await fetch('/share-target/posts', { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error(res.status);
          this.posts = await res.json();
        } catch (e) {
          this.error = true;
        } finally {
          this.loading = false;
        }
      },

      async googleSignIn() {
        this.authError = '';
        this.signingIn = true;
        const { error } = await authClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: location.origin },
        });
        this.signingIn = false;
        if (error) this.authError = error.message;
      },

      async signOut() {
        await authClient.auth.signOut();
        this.user = null;
        this.posts = [];
        this.activePost = null;
      },

      async openPost(post) {
        if (!this.user) return;
        this.activePost = post;
        this.mediaIndex = 0;
        this.fitMode = false;
        this.zoom = 1;
        this.pinch = { active: false, dist: 0, scale: 1 };
        this.comments = [];
        this.editingCaption = false;
        try {
          const res = await fetch(`/share-target/posts/${post.id}/comments`, {
            headers: { 'Accept': 'application/json' },
          });
          if (res.ok) this.comments = await res.json();
        } catch (e) {}
      },

      swipe(dx) {
        const n = this.activePost.post_media.length;
        if (Math.abs(dx) < 40) return;
        this.zoom = 1;
        this.mediaIndex = dx < 0 ? Math.min(n - 1, this.mediaIndex + 1) : Math.max(0, this.mediaIndex - 1);
        this.clearZoom();
      },

      onTouchStart(e) {
        this.touchX = e.touches[0].clientX;
        if (e.touches.length === 2) {
          const [a, b] = e.touches;
          this.pinch = {
            active: true,
            dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
            scale: this.zoom,
          };
          this.applyZoom(e);
        }
      },

      onTouchMove(e) {
        if (this.pinch.active && e.touches.length === 2) {
          const [a, b] = e.touches;
          const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          this.zoom = Math.min(4, Math.max(1, this.pinch.scale * (d / this.pinch.dist)));
          this.applyZoom(e);
        }
      },

      onTouchEnd(e) {
        if (this.pinch.active) {
          this.pinch.active = false;
          return;
        }
        const now = Date.now();
        if (now - this.tapAt < 300) {
          // Double-tap toggles 2x zoom.
          this.tapAt = 0;
          this.zoom = this.zoom > 1 ? 1 : 2.5;
          this.applyZoom();
          return;
        }
        this.tapAt = now;
        this.swipe(e.changedTouches[0].clientX - this.touchX);
      },

      onMediaTap() {
        if (this.zoom > 1) {
          this.zoom = 1;
          this.clearZoom();
          return;
        }
        this.fitMode = !this.fitMode;
      },

      // Scale the current slide's media around the pinch midpoint.
      applyZoom(e) {
        const slide = this.$el.querySelectorAll('.slide')[this.mediaIndex];
        const el = slide?.querySelector('img, video');
        if (!el) return;
        if (this.zoom > 1) {
          const r = slide.getBoundingClientRect();
          const cx = e ? e.touches[0].clientX + (e.touches[1].clientX - e.touches[0].clientX) / 2 : r.width / 2;
          const cy = e ? e.touches[0].clientY + (e.touches[1].clientY - e.touches[0].clientY) / 2 : r.height / 2;
          el.style.transformOrigin = (cx - r.left) + 'px ' + (cy - r.top) + 'px';
          el.style.transform = 'scale(' + this.zoom + ')';
        } else {
          this.clearZoom();
        }
      },

      clearZoom() {
        const slide = this.$el.querySelectorAll('.slide')[this.mediaIndex];
        const el = slide?.querySelector('img, video');
        if (!el) return;
        el.style.transform = '';
        el.style.transformOrigin = '';
      },

      startEditCaption() {
        this.captionDraft = this.activePost.caption || '';
        this.editingCaption = true;
      },

      async saveCaption() {
        const post = this.activePost;
        try {
          await fetch(`/share-target/posts/${post.id}/caption`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ caption: this.captionDraft.trim() }),
          });
          post.caption = this.captionDraft.trim();
        } catch (e) {}
        this.editingCaption = false;
      },

      async addComment() {
        const body = this.newComment.trim();
        if (!body || this.commenting) return;
        this.commenting = true;
        try {
          const res = await fetch(`/share-target/posts/${this.activePost.id}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ body }),
          });
          if (res.ok) {
            this.newComment = '';
            // Refetch so the server-set author shows immediately.
            const list = await fetch(`/share-target/posts/${this.activePost.id}/comments`, {
              headers: { 'Accept': 'application/json' },
            });
            if (list.ok) this.comments = await list.json();
          }
        } catch (e) {}
        this.commenting = false;
      },

      formatDate(s) {
        return new Date(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      },
    };
  }

  // Service worker updates are manual: a new deploy installs in the
  // background, waits, and the banner offers "Update" (skipWaiting + reload).
  // Polling + visibilitychange surface updates even on an open tab.
  (async () => {
    if (!('serviceWorker' in navigator)) return;
    const banner = document.getElementById('updateBanner');
    const btn = document.getElementById('updateBtn');
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });

    const reg = await navigator.serviceWorker.register('/sw.js');

    const offer = (sw) => {
      if (!sw) return;
      btn.onclick = () => sw.postMessage({ type: 'SKIP_WAITING' });
      banner.hidden = false;
    };

    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      sw?.addEventListener('statechange', () => {
        if (sw.state === 'installed') offer(sw);
      });
    });
    if (reg.waiting) offer(reg.waiting);

    setInterval(() => reg.update(), 5 * 60 * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  })();
</script>
</body>
</html>
